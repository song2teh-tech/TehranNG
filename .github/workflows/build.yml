name: Auto Build TehranNG APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Download and Process Icons
      run: |
        curl -L -o milad_tower.png "https://commons.wikimedia.org/wiki/Special:FilePath/Arian_sadri_milad_tower.png"
        declare -A sizes=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
        for density in "${!sizes[@]}"; do
          size=${sizes[$density]}
          convert milad_tower.png -resize "${size}x${size}" "V2rayNG/app/src/main/res/mipmap-$density/ic_launcher.png"
        done

    - name: Remove Duplicate WebP Icons
      run: find V2rayNG/app/src/main/res -name "ic_launcher.webp" -delete

    - name: Auto Fix and Customize Code
      run: |
        find V2rayNG -type f -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">TehranNG</string>|g' {} +
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorPrimary">.*<\/color>/<color name="colorPrimary">#0A192F<\/color>/g' {} +
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorPrimaryDark">.*<\/color>/<color name="colorPrimaryDark">#020C1B<\/color>/g' {} +
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorAccent">.*<\/color>/<color name="colorAccent">#64FFDA<\/color>/g' {} +
        find V2rayNG -type f -name "strings.xml" -exec perl -pi -e 's/%(?!%|\d+\$)/%%/g' {} +

    # ✅ ۱. اصلاح نهایی و اجباری نام کتابخانه (حروف بزرگ) + اضافه کردن مخزن JitPack
    - name: Fix JitPack and RxPermissions Case
      run: |
        find V2rayNG -name "settings.gradle.kts" -exec perl -0pi -e 's/(repositories\s*\{)/$1\n        maven { url = uri("https:\/\/jitpack.io") }/g' {} +
        find V2rayNG -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -exec sed -i 's/com\.github\.tbruyelle:rxpermissions:/com.github.tbruyelle:RxPermissions:/g' {} +
        find V2rayNG -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -exec sed -i 's/rxpermissions = "0.12"/RxPermissions = "0.12"/g' {} +

    - name: Enable AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> V2rayNG/gradle.properties
        echo "android.enableJetifier=true" >> V2rayNG/gradle.properties

    - name: Download libv2ray.aar
      run: |
        mkdir -p V2rayNG/app/libs
        curl -L -o V2rayNG/app/libs/libv2ray.aar "https://raw.githubusercontent.com/2dust/v2rayNG/09d854dc784365e5499e444aff065055adcc5105/V2rayNG/app/libs/libv2ray.aar"
        FILE_SIZE=$(stat -c%s "V2rayNG/app/libs/libv2ray.aar")
        if [ "$FILE_SIZE" -lt 1000000 ]; then echo "Error: file too small"; exit 1; fi

    # ✅ ۲. پاکسازی کش و ساخت بدون Daemon برای جلوگیری از خطاهای تکراری
    - name: Build APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TehranNG-Release
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
