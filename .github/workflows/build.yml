name: Auto Build TehranNG APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Download and Process Icons
      run: |
        curl -L -o milad_tower.png "https://commons.wikimedia.org/wiki/Special:FilePath/Arian_sadri_milad_tower.png"
        
        declare -A sizes=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
        for density in "${!sizes[@]}"; do
          size=${sizes[$density]}
          convert milad_tower.png -resize "${size}x${size}" "V2rayNG/app/src/main/res/mipmap-$density/ic_launcher.png"
        done

    - name: Remove Duplicate WebP Icons
      run: |
        find V2rayNG/app/src/main/res -name "ic_launcher.webp" -delete

    - name: Auto Fix and Customize Code
      run: |
        # اصلاح خطای RxPermissions
        find V2rayNG -type f -name "*.gradle*" -exec sed -i 's/com.github.tbruyelle:rxpermissions:0.12/com.github.tbruyelle:rxpermissions:0.10.2/g' {} +
        find V2rayNG -type f -name "*.toml" -exec sed -i 's/rxpermissions = "0.12"/rxpermissions = "0.10.2"/g' {} +
        
        # تغییر نام برنامه به TehranNG
        find V2rayNG -type f -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">TehranNG</string>|g' {} +
        
        # تغییر رنگ‌ها
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorPrimary">.*<\/color>/<color name="colorPrimary">#0A192F<\/color>/g' {} +
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorPrimaryDark">.*<\/color>/<color name="colorPrimaryDark">#020C1B<\/color>/g' {} +
        find V2rayNG -type f -name "colors.xml" -exec sed -i 's/<color name="colorAccent">.*<\/color>/<color name="colorAccent">#64FFDA<\/color>/g' {} +
        
        # اصلاح خطای Multiple substitutions با استفاده از perl (جایگزینی امن)
        find V2rayNG -type f -name "strings.xml" -exec perl -pi -e 's/%(?!%|\d+\$)/%%/g' {} +

    - name: Download libv2ray.aar (Direct from raw.githubusercontent)
      run: |
        mkdir -p V2rayNG/app/libs
        # استفاده از لینک خام و پایدار از مخزن v2rayNG
        curl -L -o V2rayNG/app/libs/libv2ray.aar "https://raw.githubusercontent.com/2dust/v2rayNG/09d854dc784365e5499e444aff065055adcc5105/V2rayNG/app/libs/libv2ray.aar"
        # بررسی حجم فایل برای اطمینان از دانلود صحیح
        FILE_SIZE=$(stat -c%s "V2rayNG/app/libs/libv2ray.aar")
        if [ "$FILE_SIZE" -lt 1000000 ]; then
          echo "Error: Downloaded libv2ray.aar is too small (${FILE_SIZE} bytes)."
          exit 1
        fi
        ls -lh V2rayNG/app/libs/

    - name: Build APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TehranNG-Release
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
